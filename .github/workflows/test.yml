# The tests, on every push and every pull request.
#
# There are no dependencies, so there is nothing for `npm ci` to install and
# no reason to call it: the step would fail on a missing package-lock.json,
# and keeping a lockfile for an empty dependency list is a file with nothing
# to lock.
#
# Three versions of Node, because package.json promises ">=20": a promise
# nobody checks stops being true the first day somebody writes newer syntax.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # the package is built the same way it reaches the registry: if "files"
      # ever stops listing something needed, it shows here rather than in the
      # hands of somebody who installed a broken package
      - run: npm pack --dry-run
