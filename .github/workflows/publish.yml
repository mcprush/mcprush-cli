# Publish to npm when a Release is published on GitHub, with provenance.
#
# THE TRIGGER IS THE RELEASE, NOT THE TAG. Both were possible; a release was
# chosen because that is the button a person actually presses, and because a
# tag push and a release created from that same tag would otherwise fire this
# twice — the second run failing with "cannot publish over the previously
# published version", which reads like a broken pipeline rather than a
# duplicate.
#
# WHY FROM CI RATHER THAN A LAPTOP. npm grants the "Provenance" badge only to a
# package built where it can verify the build and signed through OIDC: the
# package page then shows which commit and which run produced it. No flag can
# get that from a laptop.
#
# ONE-TIME SETUP, before the first release publishes anything:
#   1. npmjs.com → the mcprush package → Settings → Trusted publisher → GitHub
#      Actions, repository mcprush/mcprush-cli, workflow file publish.yml.
#      With that in place no token is stored anywhere.
#      If a trusted publisher does not suit you: create a granular token with
#      publish rights on mcprush, put it in this repository as the secret
#      NPM_TOKEN, and uncomment the two env lines at the bottom.
#   2. Nothing else. The id-token permission this needs is granted below.
#
# TO RELEASE:
#   npm version patch          # bumps package.json and makes the v0.1.1 tag
#   git push --follow-tags     # sends both
#   then on GitHub: Releases → Draft a new release → pick the tag → Publish.
#
# The version in the release tag has to match package.json. The step below
# checks it and stops if they disagree: a package carrying one number in the
# registry and another in the history cannot be matched to anything later.
name: publish

on:
  release:
    types: [published]
  # the same thing by hand, for a release that has to go out without one
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # THE TAG ARRIVES AS AN ENVIRONMENT VARIABLE, NOT AS TEXT PASTED INTO THE
      # SHELL. `${{ … }}` is substituted before bash sees the line, so a tag
      # carrying a quote and a semicolon becomes a command rather than a
      # string. Only the owner can create a release here, so nothing was ever
      # at stake — but it is the exact shape that gets other people's
      # pipelines, and an env var costs nothing.
      - name: the release tag and package.json name one version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "release $TAG · package.json $PKG"
          test "$TAG" = "$PKG"

      # published once and never again: a version already in the registry is a
      # version somebody may have installed, and republishing over it is the one
      # thing npm cannot undo
      - name: this version is not in the registry yet
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "mcprush@$PKG" version >/dev/null 2>&1; then
            echo "mcprush@$PKG is already published"; exit 1
          fi
          echo "mcprush@$PKG is free"

      - run: npm test
      - run: npm pack --dry-run

      - run: npm publish --provenance --access public
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
